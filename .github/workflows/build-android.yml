name: Build Android validation APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Positive Android version code; increase for every real upgrade
        required: true
        default: "40001"
      release_signing:
        description: Use the separately provisioned Android app key (not the content-update key)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/red-veil/godot/4.6.3
            ${{ runner.temp }}/red-veil-android-sdk/downloads
          key: red-veil-android-godot463-sdk3501-tools3701-v1
      - run: python scripts/install_godot.py --templates
      - run: echo "$HOME/.cache/red-veil/godot/4.6.3/bin" >> "$GITHUB_PATH"
      - run: python scripts/install_android_tools.py --sdk-root "$RUNNER_TEMP/red-veil-android-sdk"
      - run: python -m unittest discover -s tests -p test_android_build.py -v
      - name: Export and verify APK without publishing
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_SIGNING: ${{ inputs.release_signing }}
          RED_VEIL_ANDROID_KEYSTORE_BASE64: ${{ inputs.release_signing && secrets.RED_VEIL_ANDROID_KEYSTORE_BASE64 || '' }}
          RED_VEIL_ANDROID_KEYSTORE_PASSWORD: ${{ inputs.release_signing && secrets.RED_VEIL_ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_CERTIFICATE_SHA256: ${{ vars.RED_VEIL_ANDROID_CERTIFICATE_SHA256 }}
          ANDROID_KEY_ALIAS: ${{ vars.RED_VEIL_ANDROID_KEY_ALIAS || 'red-veil' }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/red-veil-android-release.keystore"
          trap 'rm -f "$key_path"' EXIT
          arguments=(--sdk-root "$RUNNER_TEMP/red-veil-android-sdk" --java-home "$JAVA_HOME" --version-code "$VERSION_CODE" --output releases/android-validation)
          if [ "$RELEASE_SIGNING" = "true" ]; then
            export RED_VEIL_ANDROID_KEYSTORE_PATH="$key_path"
            python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get("RED_VEIL_ANDROID_KEYSTORE_BASE64", "")
          if not value or not os.environ.get("RED_VEIL_ANDROID_KEYSTORE_PASSWORD"):
              raise SystemExit("Android app signing is not configured. The desktop content key cannot replace it.")
          try:
              raw = base64.b64decode(value, validate=True)
          except ValueError:
              raise SystemExit("Android keystore secret is not valid base64") from None
          if not 256 <= len(raw) <= 1024 * 1024:
              raise SystemExit("Android keystore secret size is invalid")
          Path(os.environ["RED_VEIL_ANDROID_KEYSTORE_PATH"]).write_bytes(raw)
          PY
            unset RED_VEIL_ANDROID_KEYSTORE_BASE64
            arguments+=(--release --keystore "$key_path" --alias "$ANDROID_KEY_ALIAS" --expected-certificate-sha256 "$ANDROID_CERTIFICATE_SHA256")
          fi
          python scripts/build_android.py "${arguments[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: red-veil-android-validation
          path: |
            releases/android-validation/*.apk
            releases/android-validation/android-build-manifest.json
            releases/android-validation/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 7
