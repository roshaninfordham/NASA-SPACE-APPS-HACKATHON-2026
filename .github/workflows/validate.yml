name: Validate KŌMAKU
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python scripts/sync_brand.py --check
      - run: npm run format:check
      - run: npm run check
      - run: npm test --prefix services/nasa-context-worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pwa
      - run: python -m unittest discover -s tests -p 'test_web_deploy.py'

  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/install_godot.py
      - run: echo "$HOME/.cache/red-veil/godot/4.6.3/bin" >> "$GITHUB_PATH"
      - run: python scripts/test_game.py

  screen_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:review
      - run: python -m unittest discover -s tests -p 'test_screen_review*.py'
