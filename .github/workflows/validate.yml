name: Validate KŌMAKU
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python scripts/sync_brand.py --check
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pwa
      - run: python -m unittest discover -s tests -p 'test_web_deploy.py'

  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/install_godot.py
      - run: echo "$HOME/.cache/red-veil/godot/4.6.3/bin" >> "$GITHUB_PATH"
      - run: godot --headless --path game --editor --import
      - run: godot --headless --path game --script res://tests/mission_test.gd
      - run: godot --headless --path game --script res://tests/learning_test.gd
      - run: godot --headless --path game --script res://tests/gameplay_test.gd
      - run: godot --headless --path game --script res://tests/art_contract_test.gd
      - run: godot --headless --path game --script res://tests/design_world_test.gd
      - run: godot --headless --path game --script res://tests/dialog_contract_test.gd
      - run: godot --headless --path game --script res://tests/visual_style_test.gd
      - run: godot --headless --path game --script res://tests/interior_spec_test.gd
      - run: godot --headless --path game --script res://tests/exterior_spec_test.gd
      - run: godot --headless --path game --script res://tests/suit_lab_test.gd
      - run: godot --headless --path game --script res://tests/spec_integration_test.gd
      - run: python scripts/test_updater.py
      - run: godot --headless --path game --script res://tests/update_client_test.gd
      - run: godot --headless --path game --script res://tests/update_ui_test.gd
      - run: python scripts/test_update_bootstrap.py
      - run: python -m unittest discover -s tests -p 'test_release_tools.py'
      - run: python -m unittest discover -s tests -p 'test_publish_workflow.py'
