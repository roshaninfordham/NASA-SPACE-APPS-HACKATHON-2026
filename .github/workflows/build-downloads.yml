name: Build downloadable game
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in the selected source project.godot
        required: true
      revision:
        description: Exact source commit or branch to resolve at checkout
        required: true
        default: main
      signed_updates:
        description: Include a verified desktop content update (requires the pinned public key and signing secret)
        type: boolean
        default: false
      publish:
        description: Upload to the matching existing draft release and publish it
        type: boolean
        default: false
concurrency:
  group: red-veil-release-${{ inputs.version }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/red-veil/godot/4.6.3
          key: godot-4.6.3-verified-exports-v1
      - run: python scripts/install_godot.py --templates
      - run: echo "$HOME/.cache/red-veil/godot/4.6.3/bin" >> "$GITHUB_PATH"
      - name: Build and optionally sign exact-source packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNED_UPDATES: ${{ inputs.signed_updates }}
          RED_VEIL_UPDATE_SIGNING_KEY: ${{ inputs.signed_updates && secrets.RED_VEIL_UPDATE_SIGNING_KEY || '' }}
        run: |
          arguments=(--version "$RELEASE_VERSION")
          if [ "$SIGNED_UPDATES" = "true" ]; then arguments+=(--signed-updates); fi
          python scripts/build_game.py "${arguments[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: red-veil-downloads
          path: releases/distribution/*
          if-no-files-found: error
          retention-days: 14

  native_launch:
    needs: exports
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: red-veil-downloads
          path: releases/distribution
      - name: Verify exact native package and launch
        run: python scripts/verify_native_package.py --distribution releases/distribution --report native-launch.json --require-graphical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-launch-${{ matrix.os }}
          path: |
            native-launch.json
            native-launch-logs/
          if-no-files-found: error

  publish:
    needs: [exports, native_launch]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: red-veil-downloads
          path: releases
      - name: Publish only after native launch gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/build_game.py --version "$RELEASE_VERSION" --publish-prepared

  # GITHUB_TOKEN-created releases do not trigger the release event workflow.
  # Hosting is deferred by the owner; opt in only after its public URL is verified.
  deploy_web:
    needs: publish
    if: ${{ false }} # Owner deferred hosting; use the separate manual deployment workflow later.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-web.yml
    with:
      tag: v${{ inputs.version }}
