name: Verify native published-baseline content update
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact candidate source commit
        required: true
        type: string
      build_run_id:
        description: Successful Build downloadable game run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native_update:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        baseline:
          [
            "0.6.0-alpha.1",
            "0.6.1-alpha.1",
            "0.7.0-alpha.1",
            "0.7.1-alpha.1",
            "0.8.0-alpha.1",
          ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the candidate build identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.revision }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          revision, run_id = os.environ['SOURCE_REVISION'], os.environ['BUILD_RUN_ID']
          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', revision) or not re.fullmatch(r'[1-9][0-9]{0,19}', run_id):
              raise SystemExit('Exact source and numeric build run required')
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/actions/runs/{run_id}'], text=True))
          expected = {'head_sha': revision, 'status': 'completed', 'conclusion': 'success', 'event': 'workflow_dispatch', 'path': '.github/workflows/build-downloads.yml'}
          if any(run.get(k) != v for k, v in expected.items()) or any(run.get(k, {}).get('full_name') != repository for k in ('repository', 'head_repository')):
              raise SystemExit('Candidate is not a successful exact-source build from this repository')
          print('Verified candidate build', run_id, revision)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: red-veil-downloads
          path: candidate-artifacts
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Test unchanged public installer with signed candidate
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
          BASELINE_VERSION: ${{ matrix.baseline }}
        shell: bash
        run: python scripts/verify_native_content_update.py --candidate-artifacts candidate-artifacts --expected-commit "$SOURCE_REVISION" --workspace native-update-evidence --baseline "$BASELINE_VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-content-update-${{ matrix.baseline }}-${{ matrix.os }}
          path: |
            native-update-evidence/acceptance-result.json
            native-update-evidence/harness-result.json
            native-update-evidence/logs/
          if-no-files-found: error
          retention-days: 30

  native_update_gate:
    needs: native_update
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all supported public baselines on both native platforms
        env:
          MATRIX_RESULT: ${{ needs.native_update.result }}
        run: test "$MATRIX_RESULT" = success
